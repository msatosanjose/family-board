<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#333333">
<meta name="apple-mobile-web-app-capable" content="yes">

<title>Family Board Ver.3.0</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:"Noto Sans JP","Yu Gothic",Meiryo,sans-serif;
  background:#f5f6f8;
  color:#333;
}

.container{
  max-width:1400px;
  margin:auto;
  padding:16px;
}

.header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:14px;
}

h1{margin:0;font-size:27px}

.card{
  background:white;
  border-radius:12px;
  padding:16px;
  margin-bottom:14px;
  box-shadow:0 2px 8px rgba(0,0,0,.08);
}

input,select,button{
  font:inherit;
}

input,select{
  width:100%;
  padding:9px;
  border:1px solid #ccc;
  border-radius:7px;
}

button{
  border:1px solid #ccc;
  background:white;
  border-radius:8px;
  padding:9px 14px;
  cursor:pointer;
}

button:hover{
  background:#f0f0f0;
}

.primary{
  background:#333;
  color:white;
}

.danger{
  background:#c62828;
  color:white;
  border-color:#c62828;
}

.hidden{
  display:none!important;
}

.message{
  padding:9px;
  margin-top:8px;
  border-radius:7px;
  background:#f2f2f2;
}

.ok{
  background:#eef9f0;
  color:#176b2b;
}

.error{
  background:#fff0f0;
  color:#a00000;
}

.family-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:15px;
}

.family-actions{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  align-items:center;
}

.family-list{
  margin-top:10px;
}

.family-row{
  display:flex;
  gap:8px;
  margin-bottom:8px;
  flex-wrap:wrap;
}

.family-item{
  flex:1;
  text-align:left;
}

.family-item.active{
  background:#eee;
  border-color:#333;
}

.calendar{
  background:white;
  border-radius:12px;
  padding:14px;
  box-shadow:0 2px 8px rgba(0,0,0,.08);
}

.calendar-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.calendar-grid{
  display:grid;
  grid-template-columns:repeat(7,1fr);
  border-top:1px solid #ddd;
  border-left:1px solid #ddd;
}

.weekday{
  text-align:center;
  font-weight:bold;
  padding:8px;
  background:#f1f1f1;
  border-right:1px solid #ddd;
  border-bottom:1px solid #ddd;
}

.sunday{color:#d32f2f}
.saturday{color:#1976d2}

.day{
  min-height:105px;
  padding:6px;
  border-right:1px solid #ddd;
  border-bottom:1px solid #ddd;
  background:white;
  cursor:pointer;
}

.day.today{
  background:#eee;
}

.day.selected{
  outline:3px solid #888;
  outline-offset:-3px;
}

.date-number{
  font-size:18px;
  font-weight:bold;
}

.holiday .date-number{
  color:#d32f2f;
}

.holiday-name{
  font-size:10px;
  color:#d32f2f;
  font-weight:bold;
}

.event{
  margin-top:4px;
  padding:4px;
  border-radius:5px;
  font-size:12px;
  overflow:hidden;
  white-space:nowrap;
}

.event.family{background:#f5eee2}
.event.general{background:#eee}

.schedule{
  padding:9px;
  margin:7px 0;
  border-radius:7px;
  background:#f5eee2;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:8px;
}

.schedule-main{
  flex:1;
}

.small{
  font-size:12px;
  color:#777;
}

.add-form{
  display:grid;
  grid-template-columns:140px 1fr 120px 120px;
  gap:8px;
  align-items:end;
}

@media(max-width:800px){
  .family-grid{
    grid-template-columns:1fr;
  }

  .add-form{
    grid-template-columns:1fr 1fr;
  }
}

@media(max-width:600px){
  .container{
    padding:8px;
  }

  .day{
    min-height:70px;
  }

  .event{
    font-size:10px;
  }

  .add-form{
    grid-template-columns:1fr;
  }
}
</style>

}

  .print-control{text-align:center!important;}
  .print-control button{width:100%;}
}
</style>
</head>

<div class="container">

<div class="header">

<script>
/* =========================
   日本の祝日
========================= */

const JAPAN_HOLIDAYS = {

  "2026-01-01":"元日",
  "2026-01-12":"成人の日",
  "2026-02-11":"建国記念の日",
  "2026-02-23":"天皇誕生日",
  "2026-03-20":"春分の日",
  "2026-04-29":"昭和の日",
  "2026-05-03":"憲法記念日",
  "2026-05-04":"みどりの日",
  "2026-05-05":"こどもの日",
  "2026-05-06":"振替休日",
  "2026-07-20":"海の日",
  "2026-08-11":"山の日",
  "2026-09-21":"敬老の日",
  "2026-09-22":"国民の休日",
  "2026-09-23":"秋分の日",
  "2026-10-12":"スポーツの日",
  "2026-11-03":"文化の日",
  "2026-11-23":"勤労感謝の日"

};


const SUPABASE_URL =
"https://bhjktmlgkdtumsohkryl.supabase.co";

const SUPABASE_KEY =
"sb_publishable_-MCcJ3pAKiu4VJ9jDrLXzA_Weh5MrZs";


let supabaseClient = null;
let currentUser = null;

let families = [];
let currentFamily = null;

let familyMembers = [];
let events = [];

let selectedDate = dateKey(new Date());

let displayDate =
new Date(
  new Date().getFullYear(),
  new Date().getMonth(),
  1
);


const $ = id =>
document.getElementById(id);


function escapeHtml(value){

return String(value ?? "")
.replace(/[&<>"']/g,c=>({
"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#39;"
}[c]));

}


function message(id,text,ok=false){

$(id).innerHTML =
text
?
`<div class="message ${ok?"ok":"error"}">
${escapeHtml(text)}
</div>`
:"";

}


function dateKey(d){

return `${d.getFullYear()}-${String(
d.getMonth()+1).padStart(2,"0")}-${String(
d.getDate()).padStart(2,"0")}`;

}


function formatDate(key){

const d =
new Date(key+"T00:00:00");

const week =
["日","月","火","水","木","金","土"];

return `${d.getFullYear()}年${
d.getMonth()+1}月${
d.getDate()}日（${week[d.getDay()]}）`;

}


/* =========================
   Supabase接続
========================= */

async function connect(){

try{

supabaseClient =
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);

const {data,error} =
await supabaseClient.auth.getSession();

if(error) throw error;

currentUser =
data.session?.user || null;

setUI();

if(currentUser){

await loadFamilies();

}

}catch(error){

supabaseClient=null;

setUI();

message(
"setupMessage",
"接続失敗："+(error.message || error)
);

}

}


function setUI(){

const connected =
!!supabaseClient;

$("setupCard")
.classList.toggle(
"hidden",
connected
);

$("authCard")
.classList.toggle(
"hidden",
!connected || !!currentUser
);

$("familyCard")
.classList.toggle(
"hidden",
!currentUser
);

$("mainCard")
.classList.toggle(
"hidden",
!currentUser || !currentFamily
);

$("logoutBtn")
.classList.toggle(
"hidden",
!currentUser
);

$("connectionStatus").textContent =
connected
?
(
currentUser
?
"Supabase接続済み："+currentUser.email
:
"Supabase接続済み"
)
:
"Supabase未接続";

}


/* =========================
   ログイン
========================= */

async function login(){

if(!supabaseClient){

message(
"authMessage",
"Supabaseに接続してください"
);

return;

}

const email =
$("email").value.trim();

const password =
$("password").value;

if(!email || !password){

message(
"authMessage",
"メールアドレスとパスワードを入力してください"
);

return;

}

try{

const {data,error} =
await supabaseClient.auth.signInWithPassword({
email,
password
});

if(error) throw error;

currentUser=data.user;

message(
"authMessage",
"ログインしました。",
true
);

setUI();

await loadFamilies();

}catch(error){

message(
"authMessage",
error.message || "ログインエラー"
);

}

}


/* =========================
   新規登録
========================= */

async function signup(){

const email =
$("email").value.trim();

const password =
$("password").value;

if(!email || !password){

message(
"authMessage",
"メールアドレスとパスワードを入力してください"
);

return;

}

try{

const {data,error} =
await supabaseClient.auth.signUp({
email,
password
});

if(error) throw error;

if(!data.session){

message(
"authMessage",
"登録しました。確認メールが届く場合はメールを確認してください。",
true
);

}else{

currentUser=data.user;

setUI();

await loadFamilies();

}

}catch(error){

message(
"authMessage",
error.message || "登録エラー"
);

}

}


/* =========================
   家族一覧
========================= */

async function loadFamilies(){

try{

const {data,error} =
await supabaseClient.rpc(
"get_my_families"
);

if(error) throw error;

families=data || [];

renderFamilyList();

if(
!currentFamily &&
families.length
){

await selectFamily(
families[0]
);

}

}catch(error){

message(
"familyMessage",
"家族一覧の取得に失敗しました："+error.message
);

}

}


function renderFamilyList(){

const list =
$("familyList");

list.innerHTML="";

families.forEach(f=>{

const row =
document.createElement("div");

row.className="family-row";


const select =
document.createElement("button");

select.type="button";

select.className =
"family-item"+
(
currentFamily &&
currentFamily.id===f.id
?
" active"
:
""
);

select.textContent =
`${f.name}（${f.code}）`;

select.onclick=()=>selectFamily(f);


const leave =
document.createElement("button");

leave.type="button";

leave.className="danger";

leave.textContent =
"この家族から脱退";

leave.onclick=()=>{
leaveFamily(f);
};


row.appendChild(select);

row.appendChild(leave);

list.appendChild(row);

});

}


/* =========================
   家族選択
========================= */

async function selectFamily(f){

if(!f)return;

currentFamily=f;

localStorage.setItem(
"fb3_family_id",
f.id
);

$("currentFamilyBadge").textContent =
`家族：${f.name}　コード：${f.code}`;

renderFamilyList();

setUI();

await loadMembers();

await loadEvents();

renderMemberSettings();

renderMemberSelect();

renderCalendar();

renderSchedule();

}


/* =========================
   家族脱退
========================= */

async function leaveFamily(f){

if(!currentUser){

alert("ログインしてください。");

return;

}

const ok =
confirm(
`「${f.name}」から脱退しますか？\n\n`+
"あなた自身だけがこの家族から外れます。\n"+
"他の家族メンバーと予定は削除されません。"
);

if(!ok)return;


try{

message(
"familyMessage",
"家族から脱退しています…",
true
);


const {error} =
await supabaseClient.rpc(
"leave_family",
{
p_family_id:f.id
}
);

if(error) throw error;


if(
currentFamily &&
currentFamily.id===f.id
){

currentFamily=null;

familyMembers=[];

events=[];

localStorage.removeItem(
"fb3_family_id"
);

}


await loadFamilies();


if(families.length){

await selectFamily(
families[0]
);

}else{

setUI();

}


message(
"familyMessage",
`「${f.name}」から脱退しました。`,
true
);


}catch(error){

message(
"familyMessage",
"❌ 家族から脱退できませんでした："+error.message
);

alert(
"家族から脱退できませんでした。\n\n"+
error.message
);

}

}


/* =========================
   家族作成
========================= */

async function createFamily(){

const name =
$("familyName").value.trim();

const member =
$("memberName").value.trim();

if(!name || !member){

message(
"familyMessage",
"家族名と表示名を入力してください"
);

return;

}

try{

const {data,error} =
await supabaseClient.rpc(
"create_family",
{
p_name:name,
p_member_name:member
}
);

if(error)throw error;

message(
"familyMessage",
`家族を作成しました。家族コード：${data.code}`,
true
);

$("familyName").value="";
$("memberName").value="";

await loadFamilies();

}catch(error){

message(
"familyMessage",
error.message
);

}

}


/* =========================
   家族参加
========================= */

async function joinFamily(){

const code =
$("joinCode").value
.trim()
.toUpperCase();

const member =
$("joinMemberName").value.trim();

if(!code || !member){

message(
"familyMessage",
"家族コードと表示名を入力してください"
);

return;

}

try{

const {error} =
await supabaseClient.rpc(
"join_family",
{
p_code:code,
p_member_name:member
}
);

if(error)throw error;

message(
"familyMessage",
"家族に参加しました。",
true
);

$("joinCode").value="";
$("joinMemberName").value="";

await loadFamilies();

}catch(error){

message(
"familyMessage",
error.message
);

}

}


/* =========================
   メンバー
========================= */

async function loadMembers(){

if(!currentFamily)return;

try{

const {data,error} =
await supabaseClient.rpc(
"get_family_members",
{
p_family_id:currentFamily.id

function eventsOn(key){

return events
.filter(e=>e.event_date===key)
.sort(
(a,b)=>
(a.start_time||"99:99")
.localeCompare(
b.start_time||"99:99"
)
);

}


/* =========================
   カレンダー
========================= */

function renderCalendar(){

const grid =
$("calendarGrid");

grid.innerHTML="";


["日","月","火","水","木","金","土"]
.forEach((day,i)=>{

const w =
document.createElement("div");

w.className="weekday";

if(i===0)w.classList.add("sunday");

if(i===6)w.classList.add("saturday");

w.textContent=day;

grid.appendChild(w);

});


const year =
displayDate.getFullYear();

const month =
displayDate.getMonth();

const first =
new Date(year,month,1).getDay();

const days =
new Date(year,month+1,0).getDate();


for(let i=0;i<first;i++){

const blank =
document.createElement("div");

blank.className="day";

grid.appendChild(blank);

}


for(let d=1;d<=days;d++){

const key =
dateKey(
new Date(year,month,d)
);

const cell =
document.createElement("div");

cell.className="day";

/* 祝日 */
if(JAPAN_HOLIDAYS[key]){

  cell.classList.add("holiday");

}

if(
key===dateKey(new Date())
){

cell.classList.add("today");

}


if(key===selectedDate){

cell.classList.add("selected");

}


const number =
document.createElement("div");

number.className="date-number";

number.textContent=d;

cell.appendChild(number);

/* 祝日名 */
if(JAPAN_HOLIDAYS[key]){

  const holiday =
  document.createElement("div");

  holiday.className="holiday-name";

  holiday.textContent =
  JAPAN_HOLIDAYS[key];

  cell.appendChild(holiday);

}


eventsOn(key)
.slice(0,4)
.forEach(e=>{

const event =
document.createElement("div");

event.className="event family";

event.textContent =
(e.start_time
?
e.start_time+" "
:
"")
+
"● "
+
e.title;

cell.appendChild(event);

});


cell.onclick=()=>{

selectedDate=key;

$("eventDate").value=key;

renderCalendar();

renderSchedule();

};


grid.appendChild(cell);

}


$("calendarTitle").textContent =
`${year}年 ${month+1}月`;

}

   予定表示
========================= */

function renderSchedule(){

$("selectedTitle").textContent =
`📅 ${formatDate(selectedDate)}の予定`;

const list =
$("scheduleList");

list.innerHTML="";


const day =
eventsOn(selectedDate);

if(!day.length){

list.innerHTML =
'<p class="small">この日の予定はありません。</p>';

return;

}


day.forEach(e=>{

const row =
document.createElement("div");

row.className="schedule";


const main =
document.createElement("div");

main.className="schedule-main";


const title =
document.createElement("strong");

title.textContent =
(e.start_time
?
e.start_time+" "
:
"")
+
e.title;

main.appendChild(title);


const meta =
document.createElement("div");

meta.className="small";

meta.textContent =
[
e.member_name,
e.location,
e.notes
]
.filter(Boolean)
.join("　");

main.appendChild(meta);


const del =
document.createElement("button");

del.className="danger";

del.textContent="削除";

del.onclick=()=>deleteEvent(e.id);


row.appendChild(main);

row.appendChild(del);

list.appendChild(row);

});

}

/* =========================
   買い物リスト
========================= */

function getShoppingList(){

  try{

    return JSON.parse(
      localStorage.getItem("familyBoardShopping") || "[]"
    );

  }catch(e){

    return [];

  }

}


function saveShoppingList(list){

  localStorage.setItem(
    "familyBoardShopping",
    JSON.stringify(list)
  );

}


function renderShoppingList(){

  const area =
    document.getElementById("shoppingList");

  if(!area) return;

  const list =
    getShoppingList();

  area.innerHTML = "";

  list.forEach((item,index)=>{

    const row =
      document.createElement("div");

    row.style.display = "flex";
    row.style.alignItems = "center";
    row.style.gap = "8px";
    row.style.marginBottom = "8px";


    const checkbox =
      document.createElement("input");

    checkbox.type = "checkbox";
    checkbox.checked = item.done;

    checkbox.onchange = function(){

      list[index].done =
        checkbox.checked;

      saveShoppingList(list);

      renderShoppingList();

    };


    const text =
      document.createElement("span");

    text.textContent =
      item.text;

    text.style.flex = "1";

    if(item.done){

      text.style.textDecoration =
        "line-through";

      text.style.color =
        "#999";

    }


    const deleteButton =
      document.createElement("button");

    deleteButton.textContent =
      "削除";

    deleteButton.onclick =
      function(){

        list.splice(index,1);

        saveShoppingList(list);

        renderShoppingList();

      };


    row.appendChild(checkbox);

    row.appendChild(text);

    row.appendChild(deleteButton);

    area.appendChild(row);

  });

}


function addShoppingItem(){

  const input =
    document.getElementById(
      "shoppingInput"
    );

  const text =
    input.value.trim();

  if(!text){

    alert("買うものを入力してください。");

    return;

  }


  const list =
    getShoppingList();

  list.push({

    text:text,

    done:false

  });


  saveShoppingList(list);

  input.value = "";

  renderShoppingList();

}


window.addEventListener(
  "load",
  function(){

    renderShoppingList();

  }
);

<script id="calendarPrintScript">
(function(){
  function setup(){
    var b=document.getElementById("calendarPrintButton");
    if(!b) return;
    b.onclick=function(e){
      if(e){e.preventDefault();e.stopPropagation();}
      var c=document.querySelector(".calendar");
      if(!c){alert("カレンダーが見つかりません。");return false;}
      var w=window.open("","_blank","width=1200,height=800");
      if(!w){alert("印刷画面を開けませんでした。ブラウザのポップアップを許可してください。");return false;}
      var css="";
      document.querySelectorAll("style,link[rel='stylesheet']").forEach(function(x){
        css += x.outerHTML;
      });
      w.document.open();
      w.document.write('<!doctype html><html><head><meta charset="utf-8"><title>Family Board カレンダー</title>'+css+
        '<style>@page{size:A4 landscape;margin:8mm}body{margin:0;background:#fff}.calendar{display:block!important;width:100%!important;box-shadow:none!important}.calendar button{display:none!important}</style>'+
        '</head><body>'+c.outerHTML+'</body></html>');
      w.document.close();
      setTimeout(function(){w.focus();w.print();},800);
      return false;
    };
  }
  if(document.readyState==="loading") document.addEventListener("DOMContentLoaded",setup);
  else setup();
})();
</script></body>
